<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses — CRM</title>
<script>(function(){try{var t=localStorage.getItem('crm_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<script>window.PAGE = { key: "expenses", title: "Expenses", breadcrumb: ["Finance"] };</script>

<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="page-content" id="pageContent">
      <div class="page-header">
        <div><h1>Expenses</h1><p>Track company expenses across categories.</p></div>
        <div class="page-header-actions"><button class="btn btn-primary" id="addExpenseBtn" data-icon="plus">Add Expense</button></div>
      </div>

      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);" id="expenseSummary"></div>

      <div class="table-container">
        <div class="table-toolbar">
          <div class="table-toolbar-left">
            <div class="search-box" data-icon="search"><input type="text" id="expenseSearchInput" placeholder="Search expenses..."></div>
            <select class="select-field" id="expenseCategoryFilter"></select>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Expense Title</th><th>Category</th><th>Amount</th><th>Date</th><th>Payment Method</th><th>Description</th><th class="cell-actions">Actions</th></tr></thead>
            <tbody id="expensesTableBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar">
          <span class="text-faint fs-sm" id="expensesCount"></span>
          <div class="pagination" id="expensesPagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/shared-modals.js"></script>
<script src="../js/expenses.js"></script>
</body>
</html>
