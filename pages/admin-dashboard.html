<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CRM</title>
<script>(function(){try{var t=localStorage.getItem('crm_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<script>window.PAGE = { key: "dashboard", title: "Dashboard", breadcrumb: [] };</script>

<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="page-content" id="pageContent">
      <div class="page-header dash-welcome-banner">
        <div>
          <h1>Dashboard</h1>
          <p>Welcome back — here's what's happening across your CRM today.</p>
        </div>
        <div class="page-header-actions">
          <a href="leads.html" class="btn btn-secondary">View All Leads</a>
          <a href="reports.html" class="btn btn-primary">View Reports</a>
        </div>
      </div>

      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="table-container">
        <div class="table-toolbar">
          <div class="table-toolbar-left"><h3 class="section-title dash-section-title"><span class="dash-section-dot"></span>Recent Leads</h3></div>
          <a href="leads.html" class="btn btn-ghost btn-sm">View All</a>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Lead</th><th>Contact</th><th>Assigned To</th><th>Status</th><th>Next Follow-up</th><th class="cell-actions">Action</th>
              </tr>
            </thead>
            <tbody id="recentLeadsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/dashboard-admin.js"></script>
</body>
</html>
