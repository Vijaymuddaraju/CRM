<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoices — CRM</title>
<script>(function(){try{var t=localStorage.getItem('crm_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/invoice.css">
</head>
<body>
<script>window.PAGE = { key: "invoices", title: "Invoices", breadcrumb: ["Sales Documents"] };</script>

<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="page-content" id="pageContent">
      <div class="page-header">
        <div><h1>Invoices</h1><p>Manage invoices and track payment status.</p></div>
        <div class="page-header-actions"><button class="btn btn-primary" id="addInvoiceBtn" data-icon="plus">Create Invoice</button></div>
      </div>

      <div class="table-container">
        <div class="table-toolbar">
          <div class="table-toolbar-left">
            <div class="search-box" data-icon="search"><input type="text" id="invoiceSearchInput" placeholder="Search by invoice # or customer..."></div>
            <select class="select-field" id="invoiceStatusFilter"></select>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Invoice #</th><th>Customer</th><th>Quotation</th><th>Invoice Date</th><th>Due Date</th><th>Amount</th><th>Paid</th><th>Remaining</th><th>Status</th><th class="cell-actions">Actions</th></tr></thead>
            <tbody id="invoicesTableBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar">
          <span class="text-faint fs-sm" id="invoicesCount"></span>
          <div class="pagination" id="invoicesPagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/shared-modals.js"></script>
<script src="../js/invoices.js"></script>
</body>
</html>
