<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CRM</title>
<script>(function(){try{var t=localStorage.getItem('crm_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/tables.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<script>window.PAGE = { key: "dashboard", title: "Dashboard", breadcrumb: [] };</script>

<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="page-content" id="pageContent">
      <div class="page-header">
        <div>
          <h1>Dashboard</h1>
          <p>Your leads, follow-ups and performance at a glance.</p>
        </div>
        <div class="page-header-actions">
          <a href="leads.html" class="btn btn-primary">View My Leads</a>
        </div>
      </div>

      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="dash-grid-2">
        <div class="panel">
          <div class="panel-header"><h3>Today's Follow-ups</h3></div>
          <div class="panel-body" id="todaysFollowups"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><h3>My Sales Performance</h3></div>
          <div class="panel-body" id="perfList"></div>
        </div>
      </div>

      <div class="table-container mb-4">
        <div class="table-toolbar">
          <div class="table-toolbar-left"><h3 class="section-title">My Recent Leads</h3></div>
          <a href="leads.html" class="btn btn-ghost btn-sm">View All</a>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Lead</th><th>Contact</th><th>Status</th><th>Priority</th><th>Next Follow-up</th><th class="cell-actions">Action</th></tr></thead>
            <tbody id="myRecentLeadsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="dash-grid-2">
        <div class="panel">
          <div class="panel-header"><h3>Upcoming Activities</h3></div>
          <div class="panel-body" id="upcomingActivities"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><h3>Recent Notifications</h3></div>
          <div class="panel-body" style="padding:0;" id="recentNotifs"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/dashboard-sales.js"></script>
</body>
</html>
